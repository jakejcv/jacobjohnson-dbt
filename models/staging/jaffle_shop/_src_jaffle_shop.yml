version: 2

sources:
  - name: jaffle_shop
    description: A clone of a Postgres application database.
    database: raw
    schema: jaffle_shop
    tables:
      - name: customers
        description: Raw customer data.
        # no freshness → dbt skips this table
        columns: 
          - name: id
            description: Primary key for customer data.  
            data_tests:
              - unique
              - not_null

      - name: orders
        description: Raw orders data.
        columns: 
          - name: id
            description: Primary key for orders data.
            data_tests:
              - unique
              - not_null
        config:
          loaded_at_field: _etl_loaded_at
          freshness:
            warn_after:
              count: 12
              period: hour
            error_after:
              count: 1
              period: day
      - name: customers_clean
      - name: dim_customers
      - name: fct_orders
